name: CI

# Runs on pull requests (including from forks) and on pushes to main, except when a change
# touches only documentation. No secrets are used: pull requests from forks run without access
# to any secret.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# Least privilege: jobs can only read the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Superseded pull request runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Smaller debug info keeps the test binaries within the runners' disk space.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend (svelte-check)
        run: npm run check

      - name: Check locale keys (tr/en parity)
        run: npm run check:locales

      - name: Build frontend
        run: npm run build

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # The TypeScript and Python clients of the Control API: sdk/openapi.json matches the Rust
  # code (generate.mjs --check); the packages generate their code from it in their build and
  # test commands and are tested against a real `harness serve`.
  sdk:
    name: SDK (TypeScript, Python)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        run: pipx install uv==0.12.20

      - name: Build the harness CLI
        run: cargo build -p harness-cli

      - name: Install TypeScript SDK dependencies
        run: npm ci --prefix sdk/typescript

      - name: sdk/openapi.json is up to date
        run: node sdk/generate.mjs --check

      - name: Type-check TypeScript SDK, tests and examples
        run: npm run typecheck --prefix sdk/typescript

      - name: TypeScript SDK tests
        run: node sdk/test-server.mjs -- npm test --prefix sdk/typescript

      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          uv sync --group test
          node ../test-server.mjs -- uv run --group test pytest

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails on known vulnerabilities only; unmaintained/unsound advisories stay warnings.
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock
