name: CI

# Targeted CI: a small `changes` job maps the changed paths to areas (rust, frontend, sdk,
# registry, audit) and only the matching jobs run. The `ci-ok` job always runs and reports
# one result for the whole workflow, so it is the single check to require in branch rules.
#
# - Pull requests: one Linux runner per job; docs-only pull requests run nothing heavy.
# - Push to main: the same path filters, but the Rust job runs on Windows, Linux and macOS.
# - Weekly schedule and manual runs: every job, all operating systems, and the dogfood job
#   (Harness testing itself, see dogfood.yml); the dogfood job never runs for pull requests or
#   pushes.
#
# No secrets are used: pull requests from forks run without access to any secret.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: jobs can only read the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Superseded pull request runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Smaller debug info keeps the test binaries within the runners' disk space.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.out.outputs.rust }}
      frontend: ${{ steps.out.outputs.frontend }}
      sdk: ${{ steps.out.outputs.sdk }}
      registry: ${{ steps.out.outputs.registry }}
      audit: ${{ steps.out.outputs.audit }}
      mobile: ${{ steps.out.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # dorny/paths-filter v4.0.3, pinned by commit SHA.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
            frontend:
              - 'src/**'
              - 'static/**'
              - 'shared/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'tsconfig.json'
              - 'components.json'
              - 'mobile/**'
              - 'crates/harness-core/src/tools/fixtures/**'
            sdk:
              - 'sdk/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            registry:
              - 'crates/harness-core/src/tools/fixtures/**'
              - 'src/lib/components/tools/**'
              - 'scripts/test-official-registry.mjs'
            mobile:
              - 'mobile/src-tauri/**'
            audit:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'

      # Scheduled and manual runs run everything; a change to this workflow does too.
      - name: Resolve areas
        id: out
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
          RUST: ${{ steps.filter.outputs.rust }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          SDK: ${{ steps.filter.outputs.sdk }}
          REGISTRY: ${{ steps.filter.outputs.registry }}
          AUDIT: ${{ steps.filter.outputs.audit }}
          MOBILE: ${{ steps.filter.outputs.mobile }}
        run: |
          all=false
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$WORKFLOW" = true ]; then all=true; fi
          for area in rust frontend sdk registry audit mobile; do
            var=$(echo "$area" | tr a-z A-Z)
            value=${!var}
            if [ "$all" = true ]; then value=true; fi
            echo "$area=${value:-false}" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

  # Frontend only: type check, locale parity, build and the Node tests. One Linux runner.
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Informational: lists known advisories in the production dependencies. It never fails the
      # job (an advisory without a fix would block every pull request); read the log.
      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check frontend (svelte-check)
        run: npm run check

      - name: Check locale keys (tr/en parity)
        run: npm run check:locales

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm run test:text-tool-calls

      - name: Mobile client (type check and tests)
        run: |
          npm run mobile:check
          npm run mobile:test

  # Rust workspace: rustfmt, clippy and tests. The crates depend on harness-core (and
  # harness-onnx through it), so any crate change checks the whole workspace. Pull requests
  # use Linux only; pushes to main and scheduled runs use all three operating systems.
  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["windows-latest","ubuntu-22.04","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds the built frontend, so it has to exist before clippy and tests.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # Registry fixtures: the catalog tests read crates/harness-core/src/tools/fixtures.
  registry:
    name: Registry fixtures
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Registry catalog tests
        run: node --test scripts/test-official-registry.mjs

  # The TypeScript and Python clients of the Control API: sdk/openapi.json matches the Rust
  # code (generate.mjs --check); the packages generate their code from it in their build and
  # test commands and are tested against a real `harness serve`.
  sdk:
    name: SDK (TypeScript, Python)
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        run: pipx install uv==0.12.20

      - name: Build the harness CLI
        run: cargo build -p harness-cli

      - name: Install TypeScript SDK dependencies
        run: npm ci --prefix sdk/typescript

      - name: sdk/openapi.json is up to date
        run: node sdk/generate.mjs --check

      # The v1 contract is frozen in sdk/contract/: breaking changes need a new API major version.
      - name: No breaking changes to the frozen API contract
        run: |
          node sdk/check-breaking.mjs --self-test
          node sdk/check-breaking.mjs

      - name: Type-check TypeScript SDK, tests and examples
        run: npm run typecheck --prefix sdk/typescript

      - name: TypeScript SDK tests
        run: node sdk/test-server.mjs -- npm test --prefix sdk/typescript

      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          uv sync --group test
          node ../test-server.mjs -- uv run --group test pytest

  # Harness testing itself (a headless instance with a tiny GGUF, the official registry): weekly
  # and by hand only. Pull requests and pushes skip it (the job result is "skipped", which
  # ci-ok counts as passed); release.yml runs the same workflow at release time, and
  # dogfood.yml runs itself on pushes to release/** branches.
  dogfood:
    name: Dogfood
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/dogfood.yml
    permissions:
      contents: read

  audit:
    name: cargo audit
    needs: changes
    # Runs when dependencies change and on the weekly schedule, so new advisories show up
    # without a dependency change.
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails on known vulnerabilities only; unmaintained/unsound advisories stay warnings.
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

  # The mobile client's native side (mobile/src-tauri, its own Cargo workspace): rustfmt and
  # clippy for the Android target, with the NDK the runner image ships. The Kotlin plugin and
  # the APK are built by `npm run mobile:android -- build` (see mobile/README.md), not here.
  mobile:
    name: Mobile (Android target)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path mobile/src-tauri/Cargo.toml --check

      - name: clippy (aarch64-linux-android)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo clippy --manifest-path mobile/src-tauri/Cargo.toml --target aarch64-linux-android -- -D warnings

  # Always reports, so a required check on `ci-ok` works for every pull request: jobs that
  # were skipped because their paths did not change count as passed; failures and
  # cancellations fail it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, frontend, rust, registry, sdk, audit, dogfood, mobile]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "A required CI job did not pass."
              exit 1
            fi
          done
