name: Release

# Push a tag like `v0.2.0` (matching the version in tauri.conf.json / Cargo.toml / package.json).
# Builds the Windows NSIS installer, the macOS DMGs (Apple Silicon and Intel) and the Linux AppImage
# and .deb, and creates a DRAFT GitHub release with the installers, the updater signatures and
# `latest.json`. Review the draft and publish it to roll it out. To rebuild an existing tag, run the workflow by hand with
# the `tag` input: it checks out that tag and uploads to its release.
# The macOS DMGs are signed with the Developer ID certificate and notarized by Apple when the
# APPLE_* secrets below are set; without them they fall back to the ad-hoc signature
# (`signingIdentity: "-"` in src-tauri/tauri.macos.conf.json) and Gatekeeper asks for
# confirmation on the first open.
# The `organize` job then renames the assets by operating system (Windows / macOS / Linux) and
# writes the release body from .github/release-body.md.
# Linux is built on ubuntu-22.04 so the AppImage (which bundles WebKitGTK and GStreamer from the
# build machine) also runs on older distributions. The updater's `linux-x86_64` entry in
# latest.json points at the AppImage; the .deb is updated by the system's package manager.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater signing key (`npm run tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if generated with --ci)
#   APPLE_CERTIFICATE                   base64 of the Developer ID Application certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD          the .p12 password
#   APPLE_SIGNING_IDENTITY              "Developer ID Application: <name> (<team id>)"
#   APPLE_API_ISSUER, APPLE_API_KEY     App Store Connect API key (issuer id, key id) for notarization
#   APPLE_API_KEY_P8                    contents of that key's AuthKey_<key id>.p8
# Without TAURI_SIGNING_PRIVATE_KEY the installer is still built, but no updater artifacts or
# latest.json are produced. This workflow never runs for pull requests, so fork PRs get no secrets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server:
        description: 'Also build optional Linux headless packages and Docker images'
        type: boolean
        default: false
      tag:
        description: 'Existing tag to build and release (for example v0.2.0); empty uses the selected ref'
        type: string
        required: false

# Least privilege by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Find or create the shared draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          matches=$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' "$RUNNER_TEMP/releases.json")
          count=$(jq 'length' <<< "$matches")
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple releases exist for $TAG; consolidate the drafts before retrying."
            exit 1
          elif [ "$count" -eq 1 ]; then
            [ "$(jq -r '.[0].draft' <<< "$matches")" = true ] || {
              echo "::error::Refusing to rebuild a published release."
              exit 1
            }
            release_id=$(jq -r '.[0].id' <<< "$matches")
          else
            release_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Harness Studio $TAG" \
              -F draft=true -F prerelease=false --jq '.id')
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # Harness testing itself on the tagged commit (headless instance, tiny GGUF, official
  # registry). It runs next to the installer builds and does not block them: a red result is
  # a reason to look before publishing the draft release.
  dogfood:
    # Tag pushes only: a manual rebuild of an old tag would test the dispatched ref instead.
    if: github.event_name == 'push'
    uses: ./.github/workflows/dogfood.yml
    permissions:
      contents: read

  server:
    if: github.event_name == 'workflow_dispatch' && inputs.server
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build headless packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
          npm ci
          npm run build
          cargo build --locked --release -p harness-cli
          version=$(node -p "require('./package.json').version")
          python3 packaging/server/package.py --binary target/release/harness --ui build --output target/server --version "$version"
      - name: Build CPU and Vulkan images locally
        run: |
          docker build -f packaging/server/Dockerfile --target cpu -t harness-server:cpu .
          docker build -f packaging/server/Dockerfile --target vulkan -t harness-server:vulkan .
          docker save harness-server:cpu harness-server:vulkan | gzip > target/server/harness-server-docker.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: harness-server-linux
          path: target/server/*
      - name: Attach packages to the selected release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" target/server/* --clobber
  build:
    needs: prepare
    name: ${{ matrix.target && format('{0} ({1})', matrix.platform, matrix.target) || matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check version consistency
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG#v}"
          pkg=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          fail=0
          [ "$pkg" = "$tag" ] || { echo "package.json $pkg != tag $tag"; fail=1; }
          for f in src-tauri/Cargo.toml crates/*/Cargo.toml; do
            v=$(grep -m1 '^version' "$f" | sed -E 's/.*"([^"]+)".*/\1/')
            [ "$v" = "$tag" ] || { echo "$f $v != tag $tag"; fail=1; }
          done
          exit $fail

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The GStreamer plugins are copied into the AppImage (`bundleMediaFramework`), so WebKit can
      # play audio and video without the host's GStreamer.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config \
            xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS jobs run on Apple Silicon runners; the Intel one cross-compiles.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The two macOS jobs would otherwise share (and overwrite) one cache.
          key: ${{ matrix.target }}

      - run: npm ci

      # Passes the signing key only when it is defined (an empty value would be taken as "given"
      # by Tauri and fail). The updater artifacts are built only with a signing key.
      - name: Signing secrets (only the defined ones)
        id: secrets
        shell: bash
        env:
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$S_TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "has_updater_key=true" >> "$GITHUB_OUTPUT"
            delim="EOF_${RANDOM}${RANDOM}${RANDOM}"
            { echo "TAURI_SIGNING_PRIVATE_KEY<<$delim"; echo "$S_TAURI_SIGNING_PRIVATE_KEY"; echo "$delim"; } >> "$GITHUB_ENV"
            # Always set, even empty: a key made with `--ci` has no password, and an unset
            # variable would make the signer ask for one.
            d="EOF_${RANDOM}${RANDOM}${RANDOM}"
            { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<$d"; echo "$S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; echo "$d"; } >> "$GITHUB_ENV"
          else
            echo "has_updater_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts."
          fi

      # macOS: Developer ID signing and notarization, only when all Apple secrets are defined.
      # Tauri imports the certificate into a temporary keychain and notarizes with the API key.
      - name: Apple signing secrets (only when defined)
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          S_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          S_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Every secret is needed: without the issuer or key id, notarization would run with empty
          # credentials and fail instead of falling back to the ad-hoc build.
          if [ -z "$S_APPLE_CERTIFICATE" ] || [ -z "$S_APPLE_SIGNING_IDENTITY" ] || [ -z "$S_APPLE_API_KEY_P8" ] \
            || [ -z "$S_APPLE_API_ISSUER" ] || [ -z "$S_APPLE_API_KEY" ]; then
            echo "::notice::Apple secrets are not set: the DMG is ad-hoc signed and not notarized."
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_${S_APPLE_API_KEY}.p8"
          printf '%s\n' "$S_APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            value="S_$name"
            d="EOF_${RANDOM}${RANDOM}${RANDOM}"
            { echo "$name<<$d"; echo "${!value}"; echo "$d"; } >> "$GITHUB_ENV"
          done
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "notarize=true" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Harness Studio ${{ inputs.tag || github.ref_name }}'
          # The release body is written by the `organize` job from .github/release-body.md.
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ steps.secrets.outputs.has_updater_key == 'true' }}
          args: ${{ steps.secrets.outputs.has_updater_key == 'true' && '--config src-tauri/tauri.release.conf.json ' || '' }}${{ matrix.args }}

      # Tauri notarizes and staples the .app inside the DMG, not the DMG itself, so
      # `spctl -t open` rejects the download as an "Unnotarized Developer ID" disk image. Notarize
      # and staple the DMG too, then replace the asset tauri-action uploaded (same name: GitHub
      # turns the space in "Harness Studio" into a dot).
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && steps.apple.outputs.notarize == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/"$TARGET"/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected one DMG for $TARGET, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          asset="$RUNNER_TEMP/$(basename "$dmg" | tr ' ' '.')"
          cp "$dmg" "$asset"
          gh release upload "$TAG" "$asset" --clobber -R "$GITHUB_REPOSITORY"

  # Asset names say which operating system they are for, so the download list reads by platform:
  # Harness.Studio_<v>_Windows_x64-setup.exe, _macOS_Apple-Silicon.dmg, _macOS_Intel.dmg,
  # _Linux_x86_64.AppImage, _Linux_x86_64.deb. Renaming
  # keeps each asset's id, and latest.json points at asset ids, so the updater is unaffected.
  organize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          sparse-checkout: .github
      - name: Rename assets by operating system and write the release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          release_id="${{ needs.prepare.outputs.release_id }}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r id name; do
              new=$(printf '%s' "$name" | sed -E \
                -e 's/_x64-setup\.exe/_Windows_x64-setup.exe/' \
                -e 's/_aarch64\.dmg$/_macOS_Apple-Silicon.dmg/' \
                -e 's/_x64\.dmg$/_macOS_Intel.dmg/' \
                -e 's/_aarch64\.app\.tar\.gz/_macOS_Apple-Silicon.app.tar.gz/' \
                -e 's/_x64\.app\.tar\.gz/_macOS_Intel.app.tar.gz/' \
                -e 's/_amd64\.AppImage/_Linux_x86_64.AppImage/' \
                -e 's/_amd64\.deb/_Linux_x86_64.deb/')
              if [ "$new" != "$name" ]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --jq '.name'
              fi
            done
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sed -e "s|{VERSION}|$version|g" -e "s|{BASE}|$base|g" .github/release-body.md > "$RUNNER_TEMP/body.md"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F body=@"$RUNNER_TEMP/body.md" --jq '.html_url'
