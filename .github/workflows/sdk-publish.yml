name: Publish SDKs

# Publishes the Control API clients in sdk/ to npm (@struklabs/harness-studio-sdk) and PyPI
# (harness-studio-sdk). Runs only by hand (workflow_dispatch) or for an `sdk-v*` tag; branch
# pushes and pull requests never start it. On a tag, the tag must match both package versions
# (sdk-v0.1.0 -> 0.1.0 in sdk/typescript/package.json and sdk/python/pyproject.toml).
#
# Before publishing, each job checks that sdk/openapi.json matches the Rust code and runs its
# package's tests against a real `harness serve`.
#
#   - npm: the NPM_TOKEN secret (the first publish); once a trusted publisher is set up for this
#     workflow on npmjs.com, npm publishes through OIDC and the token can be removed.
#   - PyPI: trusted publishing only (the `pypi` environment); no token is stored.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        type: choice
        options: [both, npm, pypi]
        default: both
  push:
    # Tags only: with no `branches` filter, branch pushes do not match.
    tags: ['sdk-v*']

permissions:
  contents: read

concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  npm:
    if: github.event_name == 'push' || inputs.target != 'pypi'
    name: npm
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance, later trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: npm with trusted publishing
        run: npm install -g npm@11.6.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./sdk/typescript/package.json').version")
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "::error::Tag $TAG does not match sdk/typescript/package.json version $version."
            exit 1
          fi

      - name: Build the harness CLI
        run: cargo build -p harness-cli

      - name: Install dependencies
        run: npm ci --prefix sdk/typescript

      - name: sdk/openapi.json is up to date
        run: node sdk/generate.mjs --check

      - name: Type-check
        run: npm run typecheck --prefix sdk/typescript

      - name: Tests
        run: node sdk/test-server.mjs -- npm test --prefix sdk/typescript

      # `prepack` builds again (generates src/schema.ts from sdk/openapi.json, then compiles).
      - name: Publish
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  pypi:
    if: github.event_name == 'push' || inputs.target != 'npm'
    name: PyPI
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        run: pipx install uv==0.12.20

      - name: The tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "::error::Tag $TAG does not match sdk/python/pyproject.toml version $version."
            exit 1
          fi

      - name: Build the harness CLI
        run: cargo build -p harness-cli

      - name: sdk/openapi.json is up to date
        run: node sdk/generate.mjs --check

      - name: Tests
        working-directory: sdk/python
        run: |
          uv sync --group test
          node ../test-server.mjs -- uv run --group test pytest

      # The hatch build hook generates harness_studio_api from sdk/openapi.json.
      - name: Build
        working-directory: sdk/python
        run: uv build

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: sdk/python/dist/
