<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness Studio - llama.cpp Control Center</title>
    <script>
      // First paint: same resolution as #lib/theme.ts (keep the two in sync).
      (function () {
        try {
          var d = document.documentElement;
          // WebKitGTK: native <select> styling is replaced in app.css.
          if (/Linux/i.test(navigator.userAgent) && !/Android/i.test(navigator.userAgent)) d.setAttribute('data-os', 'linux');
          var mq = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
          var schemes = { dark: 'dark', light: 'light', oled: 'dark', night: 'dark', 'hc-dark': 'dark', 'hc-light': 'light' };
          var t = localStorage.getItem('harness_theme');
          if (!t) t = mq('(prefers-color-scheme: light)') ? 'light' : 'dark';
          if (t === 'system') {
            var dark = !mq('(prefers-color-scheme: light)');
            t = mq('(prefers-contrast: more)') ? (dark ? 'hc-dark' : 'hc-light') : dark ? 'dark' : 'light';
          }
          if (!schemes[t]) t = 'dark';
          d.setAttribute('data-theme', t);
          d.setAttribute('data-scheme', schemes[t]);
          if (localStorage.getItem('harness_cvd') === '1') d.setAttribute('data-cvd', 'on');
          var lang = localStorage.getItem('harness_lang');
          if (lang === 'en' || lang === 'tr') d.lang = lang;
        } catch (e) {}
      })();
    </script>
    <style>
      /*
       * Start screen (#lib/splash.ts removes it once the first real screen is up). Plain HTML/CSS
       * so it paints before any script runs: at app start and when the window is rebuilt from
       * the tray. Colours are the theme tokens from app.css (a render-blocking stylesheet in the
       * built app); the system colours are only a fallback for the dev server, where styles
       * arrive with the scripts.
       */
      :root[data-scheme='dark'] { color-scheme: dark; }
      :root[data-scheme='light'] { color-scheme: light; }
      #hs-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--background, Canvas);
        color: var(--foreground, CanvasText);
        font-family: var(--font-sans, system-ui, sans-serif);
        transition: opacity 140ms ease-out;
        user-select: none;
        cursor: default;
      }
      #hs-splash.hs-out { opacity: 0; pointer-events: none; }
      #hs-splash .hs-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #hs-splash .hs-brand { display: flex; align-items: center; gap: 12px; pointer-events: none; }
      #hs-splash .hs-word { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
      #hs-splash .hs-track {
        position: relative;
        width: 148px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--border, GrayText);
        opacity: 0;
        animation: hs-in 200ms ease-out 180ms forwards;
        pointer-events: none;
      }
      #hs-splash .hs-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: 2px;
        background: var(--primary, Highlight);
        animation: hs-slide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes hs-in { to { opacity: 1; } }
      @keyframes hs-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(270%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #hs-splash { transition: none; }
        #hs-splash .hs-track { animation: none; opacity: 1; }
        #hs-splash .hs-bar { animation: none; left: 31%; opacity: 0.7; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="hs-splash" role="status" aria-live="polite" data-tauri-drag-region>
      <div class="hs-brand">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" />
          <path d="M7 8H17M7 12H17M7 16H12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="16.5" cy="16" r="2.25" fill="var(--primary, Highlight)" />
        </svg>
        <span class="hs-word">Harness Studio</span>
      </div>
      <div class="hs-track" aria-hidden="true"><div class="hs-bar"></div></div>
      <span id="hs-splash-label" class="hs-sr"></span>
    </div>
    <script>
      (function () {
        var l = document.getElementById('hs-splash-label');
        if (l) l.textContent = document.documentElement.lang === 'en' ? 'Loading' : 'Yükleniyor';
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
