# llama-server parameter catalog: one source for the Dashboard and `build_args`.
#
# Fields:
#   id            stable key (stored in presets/profiles as `params.<id>`)
#   flags         spellings in preference order (renamed/older spellings last); the first one
#                 the binary accepts is emitted. A flag the help marks "removed" never counts.
#   off_flags     spellings for `false` of a bool (`--no-x`)
#   kind          bool | int | float | enum | multi_enum | string | path | list | json
#   values        allowed values (enum/multi_enum); `values_from_help = true` takes them from
#                 the binary's --help (the listed values are then only extra accepted ones)
#   group         performance | memory | context | reasoning | speculative | model_files |
#                 embeddings | server | router
#   level         basic | advanced
#   label_key / help_key   i18n keys (src/lib/locales/params.ts)
#   requires      param ids (or `legacy:<field>` / `mode:router`) that must be set too
#   conflicts     param ids (or `legacy:<field>`) that must not be set at the same time
#   deprecated_by id of the param that replaces this one
#   legacy_field  typed LaunchConfig field that already emits this flag; such entries only
#                 describe the flag (UI gating, flag explorer) and are never rendered here
#   feature       feature id for the capability badge (capabilities::features)
#   min / max     numeric bounds;  separator  list join string (default ",")
#   loopback_only only emitted when the server binds to a loopback address
#   value_fallbacks  for binaries without any of `flags`: value -> args (legacy mappings)
#   harness_default  int sent when the user set neither the param nor its flag in custom
#                 args, and the runtime has the flag (lower memory than llama-server's own
#                 default; see private hs-internal performance notes)

schema_version = 1

