# whisper-server parameter catalog (ROADMAP Faz 13 R2): same shape as params.toml; the flags
# are checked against a real whisper-server --help (b5130) by a test. The typed LaunchConfig
# field (`legacy_field`) is rendered by `WhisperCppEngine::build_launch`; every other value
# goes through `params::render_params` for the chosen build.
# Groups: performance | transcription | vad | server (labels: src/lib/locales/whisper.ts).

schema_version = 1

[[param]]
id = "threads"
flags = ["-t", "--threads"]
kind = "int"
group = "performance"
level = "basic"
label_key = "wparam.threads"
help_key = "wparam.threads_help"
legacy_field = "threads"

[[param]]
id = "processors"
flags = ["-p", "--processors"]
kind = "int"
group = "performance"
level = "advanced"
label_key = "wparam.processors"
help_key = "wparam.processors_help"
min = 1

[[param]]
id = "no_gpu"
flags = ["-ng", "--no-gpu"]
kind = "bool"
group = "performance"
level = "basic"
label_key = "wparam.no_gpu"
help_key = "wparam.no_gpu_help"

[[param]]
id = "gpu_device"
flags = ["-dev", "--device"]
kind = "int"
group = "performance"
level = "advanced"
label_key = "wparam.gpu_device"
help_key = "wparam.gpu_device_help"
conflicts = ["no_gpu"]
min = 0

[[param]]
id = "no_flash_attn"
flags = ["-nfa", "--no-flash-attn"]
kind = "bool"
group = "performance"
level = "advanced"
label_key = "wparam.no_flash_attn"
help_key = "wparam.no_flash_attn_help"

[[param]]
id = "language"
flags = ["-l", "--language"]
kind = "string"
group = "transcription"
level = "basic"
label_key = "wparam.language"
help_key = "wparam.language_help"
placeholder = "auto"

[[param]]
id = "translate"
flags = ["-tr", "--translate"]
kind = "bool"
group = "transcription"
level = "basic"
label_key = "wparam.translate"
help_key = "wparam.translate_help"

[[param]]
id = "prompt"
flags = ["--prompt"]
kind = "string"
group = "transcription"
level = "basic"
label_key = "wparam.prompt"
help_key = "wparam.prompt_help"

[[param]]
