flags = ["--carry-initial-prompt"]
kind = "bool"
group = "transcription"
level = "advanced"
label_key = "wparam.carry_initial_prompt"
help_key = "wparam.carry_initial_prompt_help"
requires = ["prompt"]

[[param]]
id = "beam_size"
flags = ["-bs", "--beam-size"]
