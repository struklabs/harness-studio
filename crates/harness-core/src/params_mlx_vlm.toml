# mlx-vlm parameter catalog (the MLX vision engine's worker, `python/mlx_vlm_worker.py`, which
# hands these to mlx-vlm's server): same shape as params.toml; the flags are the worker's own.
# Everything goes through `params::render_params`. Groups: performance (labels:
# src/lib/locales/mlx.ts).

schema_version = 1

[[param]]
id = "max_tokens"
flags = ["--max-tokens"]
kind = "int"
group = "performance"
level = "basic"
label_key = "mlxparam.max_tokens"
help_key = "mlxparam.max_tokens_help"
min = 1

[[param]]
id = "kv_bits"
flags = ["--kv-bits"]
kind = "enum"
values = ["4", "8"]
group = "performance"
level = "advanced"
label_key = "mlxparam.kv_bits"
help_key = "mlxparam.kv_bits_help"

[[param]]
id = "video_max_frames"
flags = ["--video-max-frames"]
kind = "int"
group = "performance"
level = "advanced"
label_key = "mlxparam.video_max_frames"
help_key = "mlxparam.video_max_frames_help"
min = 2
max = 64
