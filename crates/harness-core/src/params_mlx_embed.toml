# MLX retrieval parameter catalog (the MLX retrieval engine's worker,
# `python/mlx_embed_worker.py`): same shape as params.toml; the flags are the worker's own.
# Groups: performance (labels: src/lib/locales/mlx.ts).

schema_version = 1

[[param]]
id = "max_tokens"
flags = ["--max-tokens"]
kind = "int"
group = "performance"
level = "advanced"
label_key = "mlxparam.embed_max_tokens"
help_key = "mlxparam.embed_max_tokens_help"
min = 16
max = 32768

[[param]]
id = "max_inputs"
flags = ["--max-inputs"]
kind = "int"
group = "performance"
level = "advanced"
label_key = "mlxparam.embed_max_inputs"
help_key = "mlxparam.embed_max_inputs_help"
min = 1
max = 4096
