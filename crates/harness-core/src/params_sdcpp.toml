# stable-diffusion.cpp (sd-server) parameter catalog (ROADMAP D1): same shape as params.toml; the
# flags are checked against a real sd-server --help (master-956) by a test. The typed
# LaunchConfig field (`legacy_field`) and `main_model_role` are rendered by
# `SdCppEngine::build_launch`; every other value goes through `params::render_params` for the
# chosen build. Path params are the components of a model "bundle" (VAE, text encoders...); the
# generation defaults are what sd-server uses for a request that does not set them.
# Groups: components | performance | generation (labels: src/lib/locales/sdcpp.ts).

schema_version = 1

[[param]]
id = "main_model_role"
flags = ["--diffusion-model"]
kind = "enum"
group = "components"
level = "advanced"
label_key = "sdparam.main_model_role"
help_key = "sdparam.main_model_role_help"
values = ["auto", "checkpoint", "diffusion"]
legacy_field = "main_model_role"

