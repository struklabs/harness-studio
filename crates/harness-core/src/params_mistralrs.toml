# mistral.rs parameter catalog (ROADMAP D6): same shape as params.toml; the flags are options of
# `mistralrs serve` (mistral.rs documentation; checked by a test against
# tests/data/mistralrs-serve.help.txt). The typed LaunchConfig fields (`legacy_field`) are
# rendered by `MistralRsEngine::build_launch`: the context as `--max-seq-len` (and the
# PagedAttention size), the concurrent requests as `--max-seqs`, `gpu_layers` 0 as `--cpu`.
# Everything else goes through `params::render_params`. Groups: model | memory | performance
# (labels: src/lib/locales/mistralrs.ts).

schema_version = 1

[[param]]
id = "context_size"
flags = ["--max-seq-len"]
kind = "int"
group = "context"
level = "basic"
label_key = "dash.lp_ctx_label_short"
help_key = "mrparam.max_seq_len_help"
legacy_field = "context_size"
min = 0

[[param]]
id = "parallel_slots"
flags = ["--max-seqs"]
kind = "int"
group = "performance"
level = "basic"
label_key = "mrparam.max_seqs"
help_key = "mrparam.max_seqs_help"
legacy_field = "parallel_slots"
min = 1

[[param]]
id = "isq"
flags = ["--isq"]
kind = "string"
group = "model"
level = "basic"
label_key = "mrparam.isq"
help_key = "mrparam.isq_help"
placeholder = "q4k"

[[param]]
id = "dtype"
flags = ["--dtype"]
kind = "enum"
values = ["auto", "bf16", "f16", "f32"]
group = "model"
level = "advanced"
label_key = "mrparam.dtype"
help_key = "mrparam.dtype_help"

[[param]]
id = "arch"
flags = ["--arch", "-a"]
kind = "string"
group = "model"
level = "advanced"
label_key = "mrparam.arch"
help_key = "mrparam.arch_help"

[[param]]
id = "max_model_len"
flags = ["--max-model-len"]
kind = "int"
group = "context"
level = "advanced"
label_key = "mrparam.max_model_len"
help_key = "mrparam.max_model_len_help"
min = 1

[[param]]
id = "paged_attn"
flags = ["--paged-attn"]
kind = "enum"
values = ["auto", "on", "off"]
values_from_help = true
group = "memory"
level = "advanced"
label_key = "mrparam.paged_attn"
help_key = "mrparam.paged_attn_help"

[[param]]
id = "pa_context_len"
flags = ["--pa-context-len"]
kind = "int"
group = "memory"
level = "advanced"
label_key = "mrparam.pa_context_len"
help_key = "mrparam.pa_context_len_help"
conflicts = ["pa_memory_mb", "pa_memory_fraction"]
min = 1

[[param]]
id = "pa_memory_mb"
flags = ["--pa-memory-mb"]
kind = "int"
group = "memory"
level = "advanced"
label_key = "mrparam.pa_memory_mb"
help_key = "mrparam.pa_memory_mb_help"
conflicts = ["pa_memory_fraction"]
min = 1

[[param]]
id = "pa_memory_fraction"
flags = ["--pa-memory-fraction"]
kind = "float"
group = "memory"
level = "advanced"
label_key = "mrparam.pa_memory_fraction"
help_key = "mrparam.pa_memory_fraction_help"
min = 0.05
max = 1.0

[[param]]
id = "pa_cache_type"
flags = ["--pa-cache-type"]
kind = "string"
group = "memory"
level = "advanced"
label_key = "mrparam.pa_cache_type"
help_key = "mrparam.pa_cache_type_help"
placeholder = "auto"
