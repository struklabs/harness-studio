<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harness Studio Chat</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#667; --card:#f3f4f6; --accent:#2f6fed; --me:#dbe7ff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#eee; --muted:#9aa; --card:#1c1e22; --accent:#6c9bff; --me:#223457; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--card); padding-top: max(10px, env(safe-area-inset-top)); }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  select, input, textarea, button { font: inherit; color: inherit; background: var(--card); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  button.ghost { background: var(--card); color: var(--fg); }
  button:disabled { opacity: .5; }
  main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 14px; background: var(--card); white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg.err { color: var(--err); }
  footer { display: flex; gap: 8px; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--card); }
  footer textarea { flex: 1; resize: none; max-height: 30vh; }
  .center { margin: auto; width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .center h2 { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .big { font-size: 40px; letter-spacing: 6px; text-align: center; font-variant-numeric: tabular-nums; }
  .err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<section id="pair" class="center" hidden>
  <h2 data-i="title"></h2>
  <p class="muted" data-i="intro"></p>
  <input id="code" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="1234-5678">
  <input id="name" maxlength="48" autocomplete="off">
  <button id="go" data-i="pair"></button>
  <p id="pairError" class="err" role="alert"></p>
</section>
<section id="wait" class="center" hidden>
  <h2 data-i="confirm"></h2>
  <p class="muted" data-i="compare"></p>
  <div id="sas" class="big"></div>
  <p class="muted" data-i="waiting"></p>
  <button id="cancel" class="ghost" data-i="cancel"></button>
</section>
<section id="chat" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header>
    <h1 data-i="chat"></h1>
    <select id="model" aria-label="Model"></select>
    <button id="unpair" class="ghost" data-i="unpair"></button>
  </header>
  <main id="log"></main>
  <footer>
    <textarea id="input" rows="1" data-ph="placeholder"></textarea>
    <button id="send" data-i="send"></button>
  </footer>
</section>
<script>
(function () {
  'use strict';
  var TR = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
  var T = TR ? {
    title: 'Harness Studio ile eşleştir', intro: 'Bilgisayardaki Harness Studio\'da Cihazlar sayfasından bir kod oluştur ve buraya yaz.',
    pair: 'Eşleştir', confirm: 'Bilgisayarda onayla', compare: 'Bilgisayarda görünen kodla bu kodun aynı olduğunu kontrol et, sonra Onayla\'ya bas.',
    waiting: 'Onay bekleniyor...', cancel: 'Vazgeç', chat: 'Sohbet', unpair: 'Bağlantıyı Kes', send: 'Gönder', placeholder: 'Mesaj yaz',
    e_code: 'Kod yanlış, kullanılmış veya süresi dolmuş.', e_locked: 'Çok fazla yanlış deneme. Bir dakika bekle.', e_denied: 'Bilgisayar eşleşmeyi reddetti.',
    e_expired: 'Süre doldu. Yeni bir kod oluştur.', e_net: 'Bilgisayara ulaşılamadı.', e_auth: 'Bu cihazın izni kaldırıldı. Yeniden eşleştir.',
    e_gen: 'İstek başarısız.', phone: 'Telefonum'
  } : {
    title: 'Pair with Harness Studio', intro: 'In Harness Studio on your computer, open Devices, create a code and type it here.',
    pair: 'Pair', confirm: 'Confirm on your computer', compare: 'Check that this code matches the one on your computer, then press Approve there.',
    waiting: 'Waiting for approval...', cancel: 'Cancel', chat: 'Chat', unpair: 'Unpair', send: 'Send', placeholder: 'Type a message',
    e_code: 'The code is wrong, used or expired.', e_locked: 'Too many wrong tries. Wait a minute.', e_denied: 'The computer refused the pairing.',
    e_expired: 'Timed out. Create a new code.', e_net: 'Could not reach the computer.', e_auth: 'This device was unpaired. Pair again.',
    e_gen: 'Request failed.', phone: 'My phone'
  };
  function $(id) { return document.getElementById(id); }
  document.querySelectorAll('[data-i]').forEach(function (n) { n.textContent = T[n.getAttribute('data-i')]; });
  document.querySelectorAll('[data-ph]').forEach(function (n) { n.placeholder = T[n.getAttribute('data-ph')]; });
  var KEY = 'harness_device_token';
  function load() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function save(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  var token = load(), timer = null, history = [], busy = false;

  function show(which) {
    ['pair', 'wait', 'chat'].forEach(function (id) { $(id).hidden = id !== which; });
    if (which === 'chat') $('chat').style.display = 'flex';
  }
  function hex(n) {
    var a = new Uint8Array(n); crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function errText(code) {
    if (code === 'pairing.invalid_code') return T.e_code;
    if (code === 'pairing.locked') return T.e_locked;
    return T.e_gen;
  }
  function api(path, opt) {
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
    });
  }

  // --- Pairing ---
  var fromHash = (location.hash.match(/code=([0-9-]+)/) || [])[1];
  if (fromHash) $('code').value = fromHash;
  $('name').value = T.phone;
  $('go').onclick = function () {
    $('pairError').textContent = '';
    $('go').disabled = true;
    api('/v1/harness/pair/claim', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: $('code').value, device_name: $('name').value || T.phone, platform: navigator.platform || 'browser', client_nonce: hex(16) })
    }).then(function (r) {
      $('go').disabled = false;
      if (!r.ok) { $('pairError').textContent = errText(r.body && r.body.error && r.body.error.code); return; }
      history.length = 0;
      $('sas').textContent = r.body.verification.slice(0, 3) + ' ' + r.body.verification.slice(3);
      show('wait');
      poll(r.body.claim_id, r.body.poll_secret);
    }).catch(function () { $('go').disabled = false; $('pairError').textContent = T.e_net; });
  };
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }
  $('cancel').onclick = function () { stop(); show('pair'); };
  function poll(id, secret) {
    stop();
    timer = setTimeout(function () {
      api('/v1/harness/pair/claim/' + encodeURIComponent(id), { headers: { 'x-harness-pair-secret': secret }, cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) { $('pairError').textContent = T.e_expired; show('pair'); return; }
          var s = r.body.status;
          if (s === 'approved' && r.body.token) { token = r.body.token; save(token); start(); }
          else if (s === 'denied') { $('pairError').textContent = T.e_denied; show('pair'); }
          else if (s === 'expired') { $('pairError').textContent = T.e_expired; show('pair'); }
          else poll(id, secret);
        }).catch(function () { poll(id, secret); });
    }, 2000);
  }

  // --- Chat ---
  function add(cls, text) {
    var d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
    $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight; return d;
  }
  function authFail() { save(''); token = ''; $('pairError').textContent = T.e_auth; show('pair'); }
  function start() {
    show('chat');
    $('log').textContent = ''; history = [];
    fetch('/v1/models', { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
      if (r.status === 401 || r.status === 403) { authFail(); return null; }
      return r.json();
    }).then(function (j) {
      if (!j) return;
      var sel = $('model'); sel.textContent = '';
      (j.data || []).forEach(function (m) { var o = document.createElement('option'); o.value = m.id; o.textContent = m.id; sel.appendChild(o); });
    }).catch(function () { add('err', T.e_net); });
  }
  $('unpair').onclick = function () { save(''); token = ''; stop(); show('pair'); };
  function send() {
    var text = $('input').value.trim();
    if (!text || busy || !$('model').value) return;
    busy = true; $('send').disabled = true; $('input').value = '';
    add('me', text); history.push({ role: 'user', content: text });
    var out = add('', '...'), acc = '';
    fetch('/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ model: $('model').value, messages: history, stream: true })
    }).then(function (r) {
      if (r.status === 401) { authFail(); throw 0; }
      if (!r.ok || !r.body) {
        return r.json().catch(function () { return {}; }).then(function (j) { throw (j.error && j.error.message) || T.e_gen; });
      }
      var rd = r.body.getReader(), dec = new TextDecoder(), buf = '';
      function pump() {
        return rd.read().then(function (x) {
          if (x.done) return;
          buf += dec.decode(x.value, { stream: true });
          var lines = buf.split('\n'); buf = lines.pop();
          lines.forEach(function (l) {
            if (l.indexOf('data:') !== 0) return;
            var d = l.slice(5).trim(); if (!d || d === '[DONE]') return;
            try {
              var c = JSON.parse(d).choices[0].delta || {};
              if (c.content) { acc += c.content; out.textContent = acc; $('log').scrollTop = $('log').scrollHeight; }
            } catch (e) {}
          });
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (acc) history.push({ role: 'assistant', content: acc }); else out.remove();
    }).catch(function (e) {
      if (e === 0) return;
      out.className = 'msg err'; out.textContent = typeof e === 'string' ? e : T.e_net;
    }).then(function () { busy = false; $('send').disabled = false; });
  }
  $('send').onclick = send;
  $('input').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  if (token) start(); else show('pair');
})();
</script>
</body>
</html>
