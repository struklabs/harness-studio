[package]
name = "harness-onnx"
version = "0.1.1"
description = "Harness ONNX engine: a small OpenAI-compatible embeddings / rerank server for Hugging Face ONNX encoder models (ONNX Runtime + tokenizers, no Python)"
authors = ["struklabs and Harness Studio contributors"]
repository = "https://github.com/struklabs/harness-studio"
homepage = "https://github.com/struklabs/harness-studio"
license = "MIT"
edition = "2021"

[lib]
name = "harness_onnx"
path = "src/lib.rs"

[[bin]]
name = "harness-onnx"
path = "src/main.rs"
required-features = ["engine"]

[features]
# The pure parts (model package layout, pooling, request/response shapes) are always built;
# `engine` adds ONNX Runtime, the tokenizer and the HTTP server (the sidecar binary).
default = ["engine"]
engine = ["dep:half", "dep:ort", "dep:tokenizers", "dep:axum", "dep:tokio", "dep:tracing", "dep:libloading", "dep:minijinja", "dep:minijinja-contrib", "dep:futures-util", "dep:bytes", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
half = { version = "2", optional = true }
# ONNX Runtime is loaded at run time (`load-dynamic`) from the managed runtime folder
# Harness downloads (SHA-256 checked); nothing is linked in. `api-24` is the oldest API level
# the DirectML build (ORT 1.24.4, the last one Microsoft ships with DirectML) offers; newer
# builds (CPU/CUDA 1.28) serve it as well.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24", "half", "directml", "cuda"], optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"], optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
# onnxruntime-genai (chat models) is bound through its C API, loaded at run time like ONNX Runtime.
libloading = { version = "0.9", optional = true }
# Chat templates (`chat_template` of tokenizer_config.json / chat_template.jinja).
minijinja = { version = "3", features = ["json", "loop_controls", "preserve_order", "serde"], optional = true }
minijinja-contrib = { version = "3", features = ["pycompat"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
bytes = { version = "1", optional = true }
# Vision models: decoding the request image, resizing, and the PNG masks and depth maps.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"], optional = true }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
