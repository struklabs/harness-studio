[workspace]
members = ["src-tauri", "crates/harness-core", "crates/harness-api", "crates/harness-cli", "crates/harness-gateway", "crates/harness-mcp", "crates/harness-onnx"]
resolver = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Size over speed for code that is not on a hot path (HTTP routing glue, CLI parsing,
# OpenAPI, OTLP export, UI shell): `opt-level = "s"` per package. Hashing (sha2), GGUF and
# RAG code (harness-core), PDF/zip decoding, JSON, SQLite, tokio and hyper stay at 3.
# Measured in docs/en/PERFORMANCE.md (idle footprint section).

[profile.release.package.axum]
opt-level = "s"

[profile.release.package.axum-core]
opt-level = "s"

[profile.release.package.tower]
opt-level = "s"

[profile.release.package.tower-http]
opt-level = "s"

[profile.release.package.clap_builder]
opt-level = "s"

